name: VoidFlame-Stats
version: 1.0.0
main: net.voidflame.stats.VoidFlameStatsPlugin
description: Stats module for VoidFlame MC.
author: VoidFlame
website: https://github.com/alialghamdi6068/VoidFlame-Stats
api-version: '26.2'
load: POSTWORLD
depend: [VoidFlame-Core]

commands:
  stats:
    description: View your VoidFlame practice statistics.
    usage: /stats
    permission: voidflame.stats

permissions:
  voidflame.stats:
    description: View practice statistics.
    default: true
  voidflame.leaderboard:
    description: View practice leaderboards.
    default: true
  voidflame.elo.modify:
    description: Modify player ELO.
    default: op
